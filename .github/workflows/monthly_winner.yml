name: Monthly Winner Announcement

on:
  schedule:
    # Se ejecuta el primer día de cada mes a las 9:00 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  announce-winner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Monthly Winner Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python monthly_winner.py
